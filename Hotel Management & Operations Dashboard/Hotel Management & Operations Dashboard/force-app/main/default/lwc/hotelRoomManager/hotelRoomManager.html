<template>
    <div class="heading"><small>PROPERTY INVENTORY</small>
        <h1>Room Management</h1>
        <p>Monitor availability and housekeeping.</p>
    </div>
    <div class="filters"><template for:each={filters} for:item="f"><button key={f.value} data-value={f.value}
                class={f.css} onclick={filterRooms}>{f.label}</button></template></div>
    <div class="grid"><template for:each={visibleRooms} for:item="r">
            <article key={r.id}>
                <div class="top">ROOM {r.number}<span class={r.statusCss}>{r.status}</span></div>
                <div class="art">‚åÇ</div>
                <h2>{r.type}</h2>
                <p>Floor {r.floor} ¬∑ {r.capacity} guests</p><b>‚Çπ{r.price} <small>/ night</small></b>
            </article>
        </template></div>
</template>
