<template>
  <div class="heading">
    <small>PROPERTY OVERVIEW</small>
    <h1>Welcome to Sheraton‚All</h1>
    <p>Your hotel at a glance.</p>
  </div>
  <div class="stats">
    <article><small>Total Bookings</small><b>{bookingCount}</b></article>
    <article><small>Available Rooms</small><b>{available}</b></article>
    <article><small>Registered Guests</small><b>{guestCount}</b></article>
    <article><small>Demo Revenue</small><b>{revenueLabel}</b></article>
  </div>
  <div class="columns">
    <section>
      <h2>Room Occupancy</h2>
      <h1>{occupancy}%</h1>
      <div class="track"><span style={progress}></span></div>
      <p>
        Occupied: {occupied}, Available: {available}, Maintenance:
        {maintenance}
      </p>
    </section>
    <section>
      <h2>Weekly Activity</h2>
      <div class="bars">
        <i style="height: 40%"></i><i style="height: 65%"></i>
        <i style="height: 52%"></i><i style="height: 82%"></i>
        <i style="height: 60%"></i><i style="height: 95%"></i>
        <i style="height: 72%"></i>
      </div>
      <p>Mon,  Tue,  Wed,  Thu,  Fri,  Sat,  Sun</p>
    </section>
  </div>
  <section class="recent">
    <h2>Recent Bookings</h2>
    <template for:each={bookings} for:item="b"></template>
      <div key={b.id} class="row">
        <b>{b.id}</b><span>{b.guest}</span><span>Room {b.room}</span><strong>‚{b.amount}</strong><em>{b.status}</em>
      </div>
    </template>
  </section>
</template>
