<template>
    <lightning-card title="Date Validation">
        <div class="slds-p-around_medium">
            <lightning-input type="date" label="Choose appointment date" value={selectedDate} min={today} onchange={handleDateChange}></lightning-input>
            <lightning-button class="slds-m-top_medium" label="Validate date" variant="brand" onclick={validateDate}></lightning-button>
            <template if:true={message}><p class="slds-m-top_small">{message}</p></template>
        </div>
    </lightning-card>
</template>
