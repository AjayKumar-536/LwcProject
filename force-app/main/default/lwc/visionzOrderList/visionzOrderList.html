<template><lightning-card title="Customer Orders" icon-name="standard:orders">
        <div class="slds-p-around_medium"><lightning-input type="email" label="Customer email" value={customerEmail}
                onchange={handleEmail}></lightning-input><lightning-button class="slds-m-top_small" label="Load orders"
                onclick={loadOrders}></lightning-button><template if:true={orders.length}><lightning-datatable
                    key-field="Id" data={orders} columns={columns}
                    hide-checkbox-column></lightning-datatable></template><template if:true={errorMessage}>
                <p class="slds-text-color_error">{errorMessage}</p>
            </template></div>
    </lightning-card></template>
