
<template>
    <lightning-card title="Apex Wire Demo with Params">
        <div class="slds-var-p-around_medium">

            <lightning-combobox
                name="type"
                label="Choose your Type"
                value={selectedType}
                options={typeOptions}
                onchange={typeHandler}>
            </lightning-combobox>

            <template if:true={hasAccounts}>
                <template for:each={accounts} for:item="account">
                    <div
                        class="slds-box slds-box_xx-small slds-m-top_small"
                        key={account.Id}>

                        <p>
                            <strong>Name:</strong> {account.Name}
                        </p>

                        <p>
                            <strong>Type:</strong> {account.Type}
                        </p>

                    </div>
                </template>
            </template>

            <template if:true={error}>
                <p class="slds-text-color_error slds-m-top_small">
                    Unable to load accounts.
                </p>
            </template>

        </div>
    </lightning-card>
</template>
