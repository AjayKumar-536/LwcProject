<template>
    <lightning-card title="Open Workspace Tab">
        <div class="slds-p-around_medium">
            <p>{message}</p>
 
            <lightning-button
                label="Open New Tab"
                variant="brand"
                onclick={handleOpenTab}>
            </lightning-button>
 
            <template lwc:if={errorDetails}>
                <p class="slds-text-color_error slds-m-top_medium">
                    Error: {errorDetails}
                </p>
            </template>
        </div>
    </lightning-card>
</template>
