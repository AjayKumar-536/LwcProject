<template>
  <lightning-card title="Medicine Inventory" icon-name="standard:product">
    <div class="slds-p-around_medium">
      <lightning-input type="search" label="Search medicines" value={searchKey} onchange={handleSearch}></lightning-input>
      <lightning-datatable class="slds-m-top_small" key-field="Id" data={medicines} columns={columns} hide-checkbox-column></lightning-datatable>
    </div>
  </lightning-card>
</template>
