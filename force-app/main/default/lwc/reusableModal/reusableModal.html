<template>
    <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <header class="slds-modal__header">
                <h2 id="modal-heading" class="slds-text-heading_medium">{titleText}</h2>
                <button class="slds-button slds-button_icon slds-modal__close" onclick={handleClose} title="Close">
                    <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                </button>
            </header>
            <div class="slds-modal__content slds-p-around_medium"><p>{messageText}</p></div>
            <footer class="slds-modal__footer"><lightning-button label="Close" onclick={handleClose}></lightning-button></footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
