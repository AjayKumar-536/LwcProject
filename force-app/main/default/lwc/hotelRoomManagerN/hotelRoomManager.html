<template><div class="form"><lightning-input type="number" label="Authorized Agoda property ID" value={propertyId} onchange={propertyChange}></lightning-input><lightning-input type="date" label="Check-in" value={checkIn} onchange={checkInChange}></lightning-input><lightning-input type="date" label="Check-out" value={checkOut} onchange={checkOutChange}></lightning-input><lightning-input type="number" label="Adults" min="1" value={adults} onchange={adultsChange}></lightning-input><lightning-input type="number" label="Rooms" min="1" value={rooms} onchange={roomsChange}></lightning-input><lightning-combobox label="Currency" value={currencyCode} options={currencies} onchange={currencyChange}></lightning-combobox><lightning-button label="Search availability" variant="brand" onclick={search} disabled={loading}></lightning-button></div><template if:true={loading}><lightning-spinner alternative-text="Searching"></lightning-spinner></template><template if:true={error}><p class="error">{error}</p></template><template if:true={results.length}><h3>Availability results</h3><template for:each={results} for:item="hotel"><article key={hotel.key}><b>{hotel.name}</b><p>{hotel.location}</p><template for:each={hotel.rooms} for:item="room"><div key={room.key} class="room"><span>{room.name}</span><b>{room.price}</b></div></template></article></template></template><template if:false={results.length}><p class="hint">Enter an authorized property ID and travel dates. Live results require Agoda partner access and a response mapper matching your API schema.</p></template></template>
