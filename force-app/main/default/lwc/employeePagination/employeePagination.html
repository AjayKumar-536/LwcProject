<template>
    <lightning-card title="Employee Pagination" icon-name="standard:people">
        <div class="slds-p-around_medium">
            <p class="slds-m-bottom_small">
                Page {currentPage} of {totalPages}
                | Total Records: {totalRecords}
            </p>

            <lightning-datatable
                key-field="id"
                data={visibleRecords}
                columns={columns}
                hide-checkbox-column>
            </lightning-datatable>

            <div class="pagination-buttons slds-m-top_medium">
                <lightning-button
                    label="First"
                    onclick={handleFirst}
                    disabled={isFirstPage}>
                </lightning-button>

                <lightning-button
                    label="Previous"
                    onclick={handlePrevious}
                    disabled={isFirstPage}>
                </lightning-button>

                <lightning-button
                    label="Next"
                    onclick={handleNext}
                    disabled={isLastPage}>
                </lightning-button>

                <lightning-button
                    label="Last"
                    onclick={handleLast}
                    disabled={isLastPage}>
                </lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
